  const d = new Date();

};
const fmtDate = (d) => {
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("es-CO", { day: "2-digit", month: "short", year: "numeric" });
};

// ---------- Conexión a Firebase ----------
const CFG = window.RP_FIREBASE_CONFIG || {};
const CONFIGURADO = !!(CFG.apiKey && CFG.projectId && !/TU[-_]/.test(String(CFG.apiKey) + String(CFG.projectId)));
let auth = null;
let db = null;
if (CONFIGURADO) {
  firebase.initializeApp(CFG);
  auth = firebase.auth();
  db = firebase.firestore();
}
const TS = () => firebase.firestore.FieldValue.serverTimestamp();

const mensajeError = (e) => {
  const c = e && e.code ? String(e.code) : "";
  if (/auth\/(invalid-credential|wrong-password|user-not-found|invalid-login-credentials|invalid-email)/.test(c)) return "Correo o contraseña incorrectos. Intenta de nuevo.";
  if (c === "auth/too-many-requests") return "Demasiados intentos fallidos. Espera unos minutos e inténtalo de nuevo.";
  if (c === "auth/user-disabled") return "Este usuario está deshabilitado.";
  if (c === "auth/network-request-failed" || c === "unavailable") return "Sin conexión con el servidor. Revisa tu internet.";
  if (c === "permission-denied") return "No tienes permiso para realizar esta acción.";
  return (e && e.message) ? e.message : String(e);
};

// Utilidades
const txt = (v, max) => { const t = String(v === undefined || v === null ? "" : v).trim(); return t === "" ? null : t.slice(0, max); };
const redondear = (n) => Math.round(Number(n) * 100) / 100;
// El nombre del material identifica su documento (evita duplicados: "Lona", "lona " y "LONA" son el mismo)
const slug = (s) => String(s).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const slugCodigo = (s) => String(s).trim().toUpperCase().replace(/[^A-Z0-9_-]+/g, "-").replace(/^-+|-+$/g, "");
const porNombre = (a, b) => String(a.nombre).localeCompare(String(b.nombre), "es");
const porCodigo = (a, b) => String(a.codigo).localeCompare(String(b.codigo), "es", { numeric: true });

const mapMaterial = (d) => { const x = d.data(); return { id: d.id, nombre: x.nombre, categoria: x.categoria || "", unidad: x.unidad, stock: Number(x.stock), stockMinimo: Number(x.stockMinimo) }; };
const mapHerramienta = (d) => { const x = d.data(); return { id: d.id, nombre: x.nombre, codigo: x.codigo, categoria: x.categoria || "", estado: x.estado, instalacion: x.instalacion, responsable: x.responsable, fechaSalida: x.fechaSalida, obsEntrega: x.obsEntrega }; };
const mapMovimiento = (d) => { const x = d.data(); return { ...x, id: d.id, usuario: x.usuarioNombre }; };

const MOV_RECIENTES = 300; // movimientos que se muestran en pantalla (el Excel exporta todos)

function Pill({ children, tone = "neutral" }) {
  const tones = {
    neutral: { bg: "#EDEAE0", fg: INK },
    good: { bg: MOSS_BG, fg: MOSS },
    warn: { bg: AMBER_BG, fg: AMBER },
    bad: { bg: RED_BG, fg: RED },
    signal: { bg: "#FDE8DD", fg: SIGNAL_DARK },
  };
  const t = tones[tone];
  return (
    <span style={{ background: t.bg, color: t.fg }} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium whitespace-nowrap">
      {children}
    </span>
  );
}

function Field({ label, children }) {
  return (
    <label className="block mb-3">
      <span className="block text-xs font-medium mb-1" style={{ color: "#5B6272" }}>{label}</span>
      {children}
    </label>
  );
}

const inputStyle = {
  width: "100%",
  border: `1px solid ${LINE}`,
  borderRadius: 8,
  padding: "9px 11px",
  fontSize: 14,
  background: "#F7F9FC",
  color: INK,
  outline: "none",
};

function Modal({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(32,33,29,0.45)" }}>
      <div className="w-full max-w-md rounded-2xl overflow-hidden" style={{ background: CARD, maxHeight: "88vh", display: "flex", flexDirection: "column" }}>
        <div className="flex items-center justify-between px-5 py-4" style={{ borderBottom: `1px solid ${LINE}` }}>
          <h3 className="font-semibold text-base" style={{ color: INK }}>{title}</h3>
          <button onClick={onClose} className="p-1 rounded-full hover:bg-black/5">
            <X size={18} color={INK} />
          </button>
        </div>
        <div className="px-5 py-4 overflow-y-auto">{children}</div>
      </div>
    </div>
  );
}

function PrimaryButton({ children, onClick, type = "button", full }) {
  return (
    <button
      type={type}
      onClick={onClick}
      style={{ background: SIGNAL, color: "#fff" }}
      className={`rounded-lg px-4 py-2.5 text-sm font-semibold hover:opacity-90 active:scale-[0.98] transition ${full ? "w-full" : ""}`}
    >
      {children}
    </button>
  );
}

function App() {
  const [user, setUser] = useState(undefined); // undefined = comprobando sesión
  const [perfil, setPerfil] = useState(null);
  const [perfilError, setPerfilError] = useState("");
  const [tab, setTab] = useState("dashboard");
  const [materiales, setMateriales] = useState([]);
  const [herramientas, setHerramientas] = useState([]);
  const [movimientos, setMovimientos] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [modal, setModal] = useState(null);
  const [busy, setBusy] = useState(false);
  const [toast, setToast] = useState(null);

  const role = perfil ? perfil.rol : null;
  const email = user && user.email ? user.email.toLowerCase() : null;

  // Sesión de Firebase Auth
  useEffect(() => {
    if (!auth) return;
    return auth.onAuthStateChanged((u) => setUser(u || null));
  }, []);

  // Al iniciar sesión: leer el perfil (rol) y suscribirse a los datos en vivo
  useEffect(() => {
    if (!db) return;
    if (!email) {
      setPerfil(null); setPerfilError(""); setLoaded(false);
      setMateriales([]); setHerramientas([]); setMovimientos([]);
      return;
    }
    let cancelled = false;
    let unsubs = [];
    (async () => {
      try {
        setPerfilError("");
        const snap = await db.collection("usuarios").doc(email).get();
        if (!snap.exists) throw new Error("Tu usuario no está autorizado en la aplicación. Pídele al administrador que te registre.");
        const p = snap.data();
        if (!ROLES[p.rol]) throw new Error("Tu usuario tiene un rol no válido. Contacta al administrador.");
        if (cancelled) return;
        setPerfil({ nombre: p.nombre || "", rol: p.rol });
        setTab("dashboard");

        const primero = { m: false, h: false, v: false };
        const listo = (k) => { primero[k] = true; if (primero.m && primero.h && primero.v && !cancelled) setLoaded(true); };
        const onErr = (e) => { if (!cancelled) setPerfilError(mensajeError(e)); };
        unsubs = [
          db.collection("materiales").onSnapshot((s) => { setMateriales(s.docs.map(mapMaterial).sort(porNombre)); listo("m"); }, onErr),
          db.collection("herramientas").onSnapshot((s) => { setHerramientas(s.docs.map(mapHerramienta).sort(porCodigo)); listo("h"); }, onErr),
          db.collection("movimientos").orderBy("createdAt", "desc").limit(MOV_RECIENTES).onSnapshot((s) => { setMovimientos(s.docs.map(mapMovimiento)); listo("v"); }, onErr),
        ];
      } catch (e) {
        if (!cancelled) setPerfilError(mensajeError(e));
      }
    })();
    return () => { cancelled = true; unsubs.forEach((u) => u()); };
  }, [email]);

  // Aviso temporal
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), toast.type === "error" ? 7000 : 2500);
    return () => clearTimeout(t);
  }, [toast]);

  // Ejecuta una operación; si falla, el formulario queda abierto con el mensaje de error
  const ejecutar = async (fn, okMsg) => {
    if (busy) return;
    setBusy(true);
    try {
      await fn();
    } catch (e) {
      setToast({ type: "error", text: mensajeError(e) });
      setBusy(false);
      return;
    }
    setModal(null);
    if (okMsg) setToast({ type: "ok", text: okMsg });
    setBusy(false);
  };

  // Registro de movimiento (todos los campos siempre presentes; la fecha de creación la pone el servidor)
  const nuevoMov = (campos) => ({
    fecha: today(), tipoRegistro: null, tipo: null,
    materialId: null, materialNombre: null, herramientaId: null, herramientaNombre: null,
    cantidad: null, unidad: null, proveedor: null, motivo: null, instalacion: null, responsable: null,
    fechaSalida: null, fechaLlegada: null, obsEntrega: null, obsRecepcion: null,
    ...campos,
    usuarioEmail: email,
    usuarioNombre: perfil.nombre || (perfil.rol === "admin" ? "Administrador" : "Almacén"),
    createdAt: TS(),
  });

  const fechaValida = (f, etiqueta) => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(f)) throw new Error(`${etiqueta} no es válida.`);
    if (f > today()) throw new Error(`${etiqueta} no puede ser futura.`);
  };

  // --- Materiales ---
  const registrarCompra = (data) => ejecutar(async () => {
    const nombre = txt(data.nombre, 120);
    const cantidad = redondear(data.cantidad);
    if (!nombre) throw new Error("El nombre del material es obligatorio.");
    if (!(cantidad > 0)) throw new Error("La cantidad debe ser mayor a cero.");
    const id = slug(nombre);
    if (!id) throw new Error("El nombre del material no es válido.");
    const ref = db.collection("materiales").doc(id);
    const movRef = db.collection("movimientos").doc();
    await db.runTransaction(async (tx) => {
      const snap = await tx.get(ref);
      let mat;
      if (snap.exists) {
        mat = snap.data();
        tx.update(ref, { stock: redondear(Number(mat.stock) + cantidad) });
      } else {
        const min = redondear(data.stockMinimo === "" || data.stockMinimo === undefined ? 5 : data.stockMinimo);
        mat = { nombre, categoria: txt(data.categoria, 80), unidad: txt(data.unidad, 30) || "unidad", stock: cantidad, stockMinimo: Number.isFinite(min) && min >= 0 ? min : 5, createdAt: TS() };
        tx.set(ref, mat);
      }
      tx.set(movRef, nuevoMov({ tipoRegistro: "material", tipo: "entrada", materialId: id, materialNombre: mat.nombre, cantidad, unidad: mat.unidad, proveedor: txt(data.proveedor, 160) }));
    });
  }, "Compra registrada");

  const registrarDescarga = (data) => ejecutar(async () => {
    const pedida = redondear(data.cantidad);
    if (!(pedida > 0)) throw new Error("La cantidad debe ser mayor a cero.");
    const ref = db.collection("materiales").doc(data.materialId);
    const movRef = db.collection("movimientos").doc();
    await db.runTransaction(async (tx) => {
      const snap = await tx.get(ref);
      if (!snap.exists) throw new Error("El material ya no existe.");
      const m = snap.data();
      const stock = Number(m.stock);
      if (stock <= 0) throw new Error(`No hay stock disponible de ${m.nombre}.`);
      const cant = Math.min(pedida, stock); // nunca deja el stock en negativo
      tx.update(ref, { stock: redondear(stock - cant) });
      tx.set(movRef, nuevoMov({ tipoRegistro: "material", tipo: "salida", materialId: ref.id, materialNombre: m.nombre, cantidad: cant, unidad: m.unidad, motivo: txt(data.motivo, 300), instalacion: txt(data.instalacion, 160) }));
    });
  }, "Descarga registrada");

  const eliminarMaterial = (id) => {
    const m = materiales.find((x) => x.id === id);
    if (!window.confirm(`¿Eliminar "${m ? m.nombre : "este material"}"? El historial de movimientos se conserva.`)) return;
    ejecutar(() => db.collection("materiales").doc(id).delete(), "Material eliminado");
  };

  // --- Herramientas ---
  const registrarNuevaHerramienta = (data) => ejecutar(async () => {
    const nombre = txt(data.nombre, 120);
    if (!nombre) throw new Error("El nombre de la herramienta es obligatorio.");
    let codigo = slugCodigo(data.codigo || "").slice(0, 40);
    if (!codigo) {
      const n = herramientas.reduce((mx, h) => { const m = /^HRR-(\d+)$/.exec(h.codigo || ""); return m ? Math.max(mx, Number(m[1])) : mx; }, 0) + 1;
      codigo = "HRR-" + String(n).padStart(3, "0");
    }
    const ref = db.collection("herramientas").doc(codigo);
    await db.runTransaction(async (tx) => {
      const snap = await tx.get(ref);
      if (snap.exists) throw new Error(`Ya existe una herramienta con el código ${codigo}.`);
      tx.set(ref, { codigo, nombre, categoria: txt(data.categoria, 80), estado: "almacen", instalacion: null, responsable: null, fechaSalida: null, obsEntrega: null, createdAt: TS() });
    });
  }, "Herramienta registrada");

  const registrarSalidaHerramienta = (data) => ejecutar(async () => {
    const instalacion = txt(data.instalacion, 160);
    const responsable = txt(data.responsable, 120);
    const fecha = data.fechaSalida || today();
    const obs = txt(data.obsEntrega, 1000);
    if (!instalacion || !responsable) throw new Error("Indica la instalación de destino y el responsable.");
    fechaValida(fecha, "La fecha de salida");
    const ref = db.collection("herramientas").doc(data.herramientaId);
    const movRef = db.collection("movimientos").doc();
    await db.runTransaction(async (tx) => {
      const snap = await tx.get(ref);
      if (!snap.exists) throw new Error("La herramienta no existe.");
      const h = snap.data();
      if (h.estado !== "almacen") throw new Error(`${h.nombre} ya está fuera del almacén.`);
      tx.update(ref, { estado: "en_uso", instalacion, responsable, fechaSalida: fecha, obsEntrega: obs });
      tx.set(movRef, nuevoMov({ fecha, tipoRegistro: "herramienta", tipo: "salida", herramientaId: ref.id, herramientaNombre: h.nombre, instalacion, responsable, fechaSalida: fecha, obsEntrega: obs }));
    });
  }, "Salida registrada");

  const registrarRegresoHerramienta = (hSel, data) => ejecutar(async () => {
    const fecha = data.fechaLlegada || today();
    const obs = txt(data.obsRecepcion, 1000);
    fechaValida(fecha, "La fecha de llegada");
    const ref = db.collection("herramientas").doc(hSel.id);
    const movRef = db.collection("movimientos").doc();
    await db.runTransaction(async (tx) => {
      const snap = await tx.get(ref);
      if (!snap.exists) throw new Error("La herramienta no existe.");
      const h = snap.data();
      if (h.estado !== "en_uso") throw new Error(`${h.nombre} ya está en el almacén.`);
      if (fecha < h.fechaSalida) throw new Error("La fecha de llegada no puede ser anterior a la fecha de salida.");
      tx.update(ref, { estado: "almacen", instalacion: null, responsable: null, fechaSalida: null, obsEntrega: null });
      tx.set(movRef, nuevoMov({ fecha, tipoRegistro: "herramienta", tipo: "regreso", herramientaId: ref.id, herramientaNombre: h.nombre, instalacion: h.instalacion, responsable: h.responsable, fechaSalida: h.fechaSalida, fechaLlegada: fecha, obsEntrega: h.obsEntrega || null, obsRecepcion: obs }));
    });
  }, "Regreso registrado");

  const cerrarSesion = () => { auth.signOut(); };

  const bajoStock = materiales.filter((m) => m.stock <= m.stockMinimo);
  const enUso = herramientas.filter((h) => h.estado === "en_uso");

  if (!db) return <SetupScreen />;

  if (user === undefined || (user && !loaded && !perfilError)) {
    return (
      <div style={{ background: PAPER, minHeight: 480 }} className="flex items-center justify-center rounded-2xl">
        <p style={{ color: "#5B6272" }} className="text-sm">Cargando inventario…</p>
      </div>
    );
  }

  if (!user) return <LoginScreen />;

  if (perfilError) {
    return (
      <div style={{ background: INK, minHeight: 480, borderRadius: 20 }} className="flex items-center justify-center p-6">
        <div style={{ background: CARD, width: "100%", maxWidth: 380 }} className="rounded-2xl p-7">
          <p className="text-sm mb-4 flex items-start gap-2" style={{ color: RED }}><AlertTriangle size={16} /> {perfilError}</p>
          <PrimaryButton full onClick={cerrarSesion}>Cerrar sesión</PrimaryButton>
        </div>
      </div>
    );
  }

  const NavItem = ({ id, icon: Icon, label }) => (
    <button
      onClick={() => setTab(id)}
      className="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition"
      style={{
        background: tab === id ? "rgba(232,93,44,0.16)" : "transparent",
        color: tab === id ? SIGNAL : "#C9C7B8",
      }}
    >
      <Icon size={17} />
      {label}
    </button>
  );

  return (
    <div style={{ background: PAPER, color: INK, minHeight: 600, borderRadius: 20, overflow: "hidden", fontFamily: "ui-sans-serif, system-ui, sans-serif" }} className="flex flex-col md:flex-row">
      {/* Sidebar */}
      <div style={{ background: INK, minWidth: 220 }} className="flex md:flex-col justify-between p-4">
        <div>
          <div className="flex items-center gap-2 px-2 mb-6">
            <img src={LOGO_URL} alt="Rueda Publicidad" style={{ width: 44, height: 34, objectFit: "contain" }} />
            <div>
              <p className="text-white font-bold text-sm leading-tight tracking-tight">RUEDA</p>
              <p className="text-white font-bold text-sm leading-tight tracking-tight">PUBLICIDAD</p>
            </div>
          </div>
          <div className="hidden md:flex flex-col gap-1">
            <NavItem id="dashboard" icon={LayoutDashboard} label="Panel" />
            <NavItem id="materiales" icon={Package} label="Materiales" />
            <NavItem id="herramientas" icon={Wrench} label="Herramientas" />
            <NavItem id="movimientos" icon={ClipboardList} label="Movimientos" />
          </div>
        </div>
      </div>

      {/* Mobile tabs */}
      <div className="md:hidden flex gap-1 px-3 pt-3 overflow-x-auto" style={{ background: INK }}>
        <NavItem id="dashboard" icon={LayoutDashboard} label="Panel" />
        <NavItem id="materiales" icon={Package} label="Materiales" />
        <NavItem id="herramientas" icon={Wrench} label="Herramientas" />
        <NavItem id="movimientos" icon={ClipboardList} label="Movimientos" />
      </div>

      {/* Main */}
      <div className="flex-1 min-w-0">
        {/* Top bar */}
        <div className="flex items-center justify-between px-6 py-4" style={{ borderBottom: `1px solid ${LINE}` }}>
          <h2 className="font-bold text-lg" style={{ color: INK }}>
            {{ dashboard: "Panel general", materiales: "Materiales", herramientas: "Herramientas", movimientos: "Historial de movimientos" }[tab]}
          </h2>
          <div className="flex items-center gap-2">
            {busy && <span className="text-xs" style={{ color: "#6B7280" }}>Guardando…</span>}
            <span
              title={user.email}
              className="flex items-center gap-2 pl-3 pr-3 py-2 rounded-full text-sm font-medium"
              style={{ background: CARD, border: `1px solid ${LINE}` }}
            >
              <User size={15} />
              {ROLES[role].label}
            </span>
            <button
              onClick={cerrarSesion}
              title="Cerrar sesión"
              className="flex items-center gap-1.5 px-3 py-2 rounded-full text-sm font-medium hover:bg-black/5"
              style={{ border: `1px solid ${LINE}`, color: INK }}
            >
              <LogOut size={15} />
              <span className="hidden sm:inline">Salir</span>
            </button>
          </div>
        </div>

        <div className="p-6">
          {tab === "dashboard" && (
            <Dashboard
              materiales={materiales} herramientas={herramientas} movimientos={movimientos}
              bajoStock={bajoStock} enUso={enUso}
            />
          )}
          {tab === "materiales" && (
            <Materiales
              role={role} materiales={materiales} setModal={setModal} eliminarMaterial={eliminarMaterial}
            />
          )}
          {tab === "herramientas" && (
            <Herramientas
              role={role} herramientas={herramientas} setModal={setModal}
            />
          )}
          {tab === "movimientos" && <Movimientos movimientos={movimientos} role={role} onError={(m) => setToast({ type: "error", text: m })} />}
        </div>
      </div>

      {modal === "compra" && (
        <FormCompra materiales={materiales} onSubmit={registrarCompra} onClose={() => setModal(null)} />
      )}
      {modal === "descarga" && (
        <FormDescarga materiales={materiales} onSubmit={registrarDescarga} onClose={() => setModal(null)} />
      )}
      {modal === "nuevaHerramienta" && (
        <FormNuevaHerramienta onSubmit={registrarNuevaHerramienta} onClose={() => setModal(null)} />
      )}
      {modal && modal.type === "salidaHerramienta" && (
        <FormSalidaHerramienta herramienta={modal.h} onSubmit={registrarSalidaHerramienta} onClose={() => setModal(null)} />
      )}
      {modal && modal.type === "regresoHerramienta" && (
        <FormRegresoHerramienta herramienta={modal.h} onSubmit={(data) => registrarRegresoHerramienta(modal.h, data)} onClose={() => setModal(null)} />
      )}

      {toast && (
        <div style={{ position: "fixed", top: 16, left: "50%", transform: "translateX(-50%)", zIndex: 60, maxWidth: "92vw",
                      background: toast.type === "error" ? RED_BG : MOSS_BG, color: toast.type === "error" ? RED : SIGNAL_DARK,
                      border: `1px solid ${toast.type === "error" ? RED : SIGNAL}`, boxShadow: "0 6px 24px rgba(0,0,0,.15)" }}
             className="rounded-xl px-4 py-3 text-sm font-medium flex items-start gap-2">
          {toast.type === "error" ? <AlertTriangle size={16} /> : <CheckCircle2 size={16} />}
          <span>{toast.text}</span>
        </div>
      )}
    </div>
  );
}

function StatCard({ label, value, icon: Icon, tone }) {
  const tones = {
    neutral: { bg: CARD, fg: INK },
    signal: { bg: SIGNAL, fg: "#fff" },
    warn: { bg: AMBER_BG, fg: AMBER },
  };
  const t = tones[tone || "neutral"];
  return (
    <div style={{ background: t.bg, border: tone === "signal" ? "none" : `1px solid ${LINE}` }} className="rounded-2xl p-4 flex-1 min-w-[150px]">
      <div className="flex items-center justify-between mb-2">
        <span className="text-xs font-medium opacity-80" style={{ color: t.fg }}>{label}</span>
        <Icon size={16} color={t.fg} />
      </div>
      <p className="text-2xl font-bold" style={{ color: t.fg }}>{value}</p>
    </div>
  );
}

function Dashboard({ materiales, herramientas, movimientos, bajoStock, enUso }) {
  return (
    <div className="flex flex-col gap-6">
      <div className="flex flex-wrap gap-3">
        <StatCard label="Referencias de material" value={materiales.length} icon={Package} tone="signal" />
        <StatCard label="Herramientas registradas" value={herramientas.length} icon={Wrench} />
        <StatCard label="Herramientas fuera del almacén" value={enUso.length} icon={MapPin} />
        <StatCard label="Materiales con stock bajo" value={bajoStock.length} icon={AlertTriangle} tone={bajoStock.length ? "warn" : "neutral"} />
      </div>

      {bajoStock.length > 0 && (
        <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-2xl p-5">
          <h3 className="font-semibold text-sm mb-3 flex items-center gap-2" style={{ color: AMBER }}>
            <AlertTriangle size={16} /> Materiales por reponer
          </h3>
          <div className="flex flex-col gap-2">
            {bajoStock.map((m) => (
              <div key={m.id} className="flex items-center justify-between text-sm py-1.5" style={{ borderBottom: `1px solid ${LINE}` }}>
                <span>{m.nombre}</span>
                <Pill tone="warn">{m.stock} {m.unidad} disponibles</Pill>
              </div>
            ))}
          </div>
        </div>
      )}

      {enUso.length > 0 && (
        <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-2xl p-5">
          <h3 className="font-semibold text-sm mb-3 flex items-center gap-2" style={{ color: INK }}>
            <MapPin size={16} /> Herramientas en instalación
          </h3>
          <div className="flex flex-col gap-2">
            {enUso.map((h) => (
              <div key={h.id} className="flex items-center justify-between text-sm py-1.5" style={{ borderBottom: `1px solid ${LINE}` }}>
                <div>
                  <p className="font-medium">{h.nombre}</p>
                  <p className="text-xs" style={{ color: "#6B7280" }}>{h.instalacion} · a cargo de {h.responsable}</p>
                </div>
                <Pill tone="signal">desde {fmtDate(h.fechaSalida)}</Pill>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-2xl p-5">
        <h3 className="font-semibold text-sm mb-3">Actividad reciente</h3>
        {movimientos.length === 0 ? (
          <p className="text-sm" style={{ color: "#6B7280" }}>Todavía no hay movimientos registrados.</p>
        ) : (
          <div className="flex flex-col gap-2">
            {movimientos.slice(0, 6).map((mv) => <MovimientoRow key={mv.id} mv={mv} />)}
          </div>
        )}
      </div>
    </div>
  );
}

function MovimientoRow({ mv }) {
  const isEntrada = mv.tipo === "entrada" || mv.tipo === "regreso";
  return (
    <div className="flex items-center gap-3 text-sm py-2" style={{ borderBottom: `1px solid ${LINE}` }}>
      <div style={{ background: isEntrada ? MOSS_BG : RED_BG }} className="w-7 h-7 rounded-full flex items-center justify-center shrink-0">
        {isEntrada ? <ArrowDownToLine size={13} color={MOSS} /> : <ArrowUpFromLine size={13} color={RED} />}
      </div>
      <div className="flex-1 min-w-0">
        {mv.tipoRegistro === "material" ? (
          <p className="truncate">
            <span className="font-medium">{mv.tipo === "entrada" ? "Compra" : "Descarga"}</span> · {mv.cantidad} {mv.unidad} de {mv.materialNombre}
          </p>
        ) : (
          <>
            <p className="truncate">
              <span className="font-medium">{mv.tipo === "salida" ? "Salida" : "Regreso"}</span> · {mv.herramientaNombre}
              {mv.tipo === "salida" && ` → ${mv.instalacion} (${mv.responsable})`}
            </p>
            {mv.tipo === "regreso" && (
              <p className="text-xs" style={{ color: "#6B7280" }}>
                Salió: {mv.fechaSalida ? fmtDate(mv.fechaSalida) : "—"} · Llegó: {fmtDate(mv.fechaLlegada || mv.fecha)}
              </p>
            )}
            {mv.obsEntrega && (
              <p className="text-xs" style={{ color: "#6B7280" }}><span className="font-medium">Obs. de entrega:</span> {mv.obsEntrega}</p>
            )}
            {mv.obsRecepcion && (
              <p className="text-xs" style={{ color: "#6B7280" }}><span className="font-medium">Obs. de recepción:</span> {mv.obsRecepcion}</p>
            )}
          </>
        )}
        <p className="text-xs" style={{ color: "#6B7280" }}>{fmtDate(mv.fecha)} · {mv.usuario}</p>
      </div>
    </div>
  );
}

function Materiales({ role, materiales, setModal, eliminarMaterial }) {
  return (
    <div className="flex flex-col gap-4">
      <div className="flex flex-wrap gap-2">
        {role === "admin" && (
          <PrimaryButton onClick={() => setModal("compra")}>
            <span className="flex items-center gap-1.5"><Plus size={15} /> Registrar compra</span>
          </PrimaryButton>
        )}
        <button
          onClick={() => setModal("descarga")}
          className="rounded-lg px-4 py-2.5 text-sm font-semibold"
          style={{ background: CARD, border: `1px solid ${LINE}`, color: INK }}
        >
          <span className="flex items-center gap-1.5"><ArrowUpFromLine size={15} /> Registrar descarga</span>
        </button>
      </div>

      <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-2xl overflow-hidden">
        {materiales.length === 0 ? (
          <p className="p-5 text-sm" style={{ color: "#6B7280" }}>No hay materiales registrados todavía.</p>
        ) : materiales.map((m) => {
          const bajo = m.stock <= m.stockMinimo;
          return (
            <div key={m.id} className="flex items-center justify-between gap-3 px-5 py-3.5" style={{ borderBottom: `1px solid ${LINE}` }}>
              <div className="min-w-0">
                <p className="font-medium text-sm truncate">{m.nombre}</p>
                <p className="text-xs" style={{ color: "#6B7280" }}>{m.categoria} · mínimo {m.stockMinimo} {m.unidad}</p>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <Pill tone={bajo ? "warn" : "good"}>{m.stock} {m.unidad}</Pill>
                {role === "admin" && (

const limpiar = (v) => (v === undefined || v === null || v === "—" ? "" : v);
const fechaExcel = (f) => {
  const [y, m, d] = String(f).split("-").map(Number);
  return new Date(Date.UTC(y, (m || 1) - 1, d || 1, 12));
};

function exportarMovimientosExcel(movimientos) {
  const headers = ["Fecha", "Tipo de registro", "Movimiento", "Ítem", "Cantidad", "Unidad", "Proveedor", "Instalación / Obra", "Motivo", "Responsable", "Fecha de salida", "Fecha de llegada", "Obs. de entrega", "Obs. de recepción", "Registrado por"];
  const filas = movimientos.map((mv) => {
    const esMat = mv.tipoRegistro === "material";
    const movimiento = esMat
      ? (mv.tipo === "entrada" ? "Compra" : "Descarga")
      : (mv.tipo === "salida" ? "Salida" : "Regreso");
    // Compatibilidad con movimientos antiguos que no guardaban estas fechas
    const fSalida = esMat ? "" : (mv.fechaSalida || (mv.tipo === "salida" ? mv.fecha : ""));
    const fLlegada = esMat ? "" : (mv.fechaLlegada || (mv.tipo === "regreso" ? mv.fecha : ""));
    return [
      fechaExcel(mv.fecha),
      esMat ? "Material" : "Herramienta",
      movimiento,
      esMat ? mv.materialNombre : mv.herramientaNombre,
      esMat ? mv.cantidad : "",
      esMat ? limpiar(mv.unidad) : "",
      limpiar(mv.proveedor),
      limpiar(mv.instalacion),
      limpiar(mv.motivo),
      limpiar(mv.responsable),
      fSalida ? fechaExcel(fSalida) : "",
      fLlegada ? fechaExcel(fLlegada) : "",
      esMat ? "" : limpiar(mv.obsEntrega),
      esMat ? "" : limpiar(mv.obsRecepcion),
      limpiar(mv.usuario),
    ];
  });

  // Resumen de materiales (compras vs descargas)
  const resumen = {};
  movimientos.filter((mv) => mv.tipoRegistro === "material").forEach((mv) => {
    const r = resumen[mv.materialNombre] || (resumen[mv.materialNombre] = { unidad: mv.unidad, compras: 0, descargas: 0 });
    if (mv.tipo === "entrada") r.compras += Number(mv.cantidad) || 0;
    else r.descargas += Number(mv.cantidad) || 0;
  });
  const filasResumen = Object.keys(resumen).sort().map((n) => [n, resumen[n].unidad, resumen[n].compras, resumen[n].descargas, resumen[n].compras - resumen[n].descargas]);

  const stamp = today();
  const nombreArchivo = `movimientos_rueda_publicidad_${stamp}`;

  if (typeof XLSX === "undefined") {
    // Respaldo: CSV si no cargó la librería de Excel (sin internet)
    const esc = (v) => `"${String(v instanceof Date ? v.toISOString().slice(0, 10) : v).replace(/"/g, '""')}"`;
    const csv = [headers, ...filas].map((r) => r.map(esc).join(";")).join("\r\n");
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nombreArchivo + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }

  const wb = XLSX.utils.book_new();

  const ws = XLSX.utils.aoa_to_sheet([headers, ...filas], { cellDates: true, dateNF: "dd/mm/yyyy" });
  ws["!cols"] = [{ wch: 12 }, { wch: 16 }, { wch: 13 }, { wch: 34 }, { wch: 10 }, { wch: 10 }, { wch: 22 }, { wch: 28 }, { wch: 26 }, { wch: 22 }, { wch: 15 }, { wch: 15 }, { wch: 40 }, { wch: 40 }, { wch: 16 }];
  ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: filas.length, c: headers.length - 1 } }) };
  XLSX.utils.book_append_sheet(wb, ws, "Movimientos");

  const wsR = XLSX.utils.aoa_to_sheet([["Material", "Unidad", "Total comprado", "Total descargado", "Neto"], ...filasResumen]);
  wsR["!cols"] = [{ wch: 34 }, { wch: 10 }, { wch: 16 }, { wch: 18 }, { wch: 10 }];
  XLSX.utils.book_append_sheet(wb, wsR, "Resumen materiales");

  XLSX.writeFile(wb, nombreArchivo + ".xlsx", { cellDates: true });
}

function Movimientos({ movimientos, role, onError }) {
  const [exportando, setExportando] = useState(false);

  const exportar = async () => {
    if (exportando || role !== "admin") return;
    setExportando(true);
    try {
      const snap = await db.collection("movimientos").orderBy("createdAt", "desc").get();
      const todos = snap.docs.map(mapMovimiento);
      if (todos.length) exportarMovimientosExcel(todos);
    } catch (e) {
      onError("No se pudo exportar: " + mensajeError(e));
    }
    setExportando(false);
  };

  return (
    <div className="flex flex-col gap-4">
      {role === "admin" && (
        <div className="flex flex-wrap items-center gap-3">
          <PrimaryButton onClick={exportar}>
            <span className="flex items-center gap-1.5"><Download size={15} /> {exportando ? "Generando…" : "Exportar a Excel"}</span>
          </PrimaryButton>
          <span className="text-xs" style={{ color: "#6B7280" }}>
            {movimientos.length === 0 ? "No hay movimientos para exportar." : "Exporta todo el historial · incluye hoja de resumen de materiales"}
          </span>
        </div>
      )}
      <div style={{ background: CARD, border: `1px solid ${LINE}` }} className="rounded-2xl overflow-hidden">
        {movimientos.length === 0 ? (
          <p className="p-5 text-sm" style={{ color: "#6B7280" }}>No hay movimientos registrados todavía.</p>
        ) : (
          <div className="px-5">
            {movimientos.map((mv) => <MovimientoRow key={mv.id} mv={mv} />)}
          </div>
        )}
      </div>
      {movimientos.length >= MOV_RECIENTES && (
        <p className="text-xs" style={{ color: "#6B7280" }}>Se muestran los últimos {MOV_RECIENTES} movimientos. El Excel incluye todos.</p>
      )}
    </div>
  );
}

function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (!email.trim() || !password) { setError("Ingresa tu correo y tu contraseña."); return; }
    setLoading(true);
    setError("");
    try {
      await auth.signInWithEmailAndPassword(email.trim(), password);
    } catch (err) {
      setError(mensajeError(err));
      setLoading(false);
    }
  };

  return (
    <div style={{ background: INK, minHeight: 560, borderRadius: 20 }} className="flex items-center justify-center p-6">
      <form onSubmit={submit} style={{ background: CARD, width: "100%", maxWidth: 380 }} className="rounded-2xl p-7">
        <div className="flex justify-center mb-5">
          <img src={LOGO_URL} alt="Rueda Publicidad" style={{ width: 150, height: "auto", objectFit: "contain" }} />
        </div>
        <h2 className="font-semibold text-base mb-1" style={{ color: INK }}>Control de inventario</h2>
        <p className="text-sm mb-5" style={{ color: "#5B6272" }}>Ingresa con tu usuario para continuar.</p>

        <Field label="Correo">
          <div className="relative">
            <User size={15} style={{ position: "absolute", left: 11, top: 12 }} color="#8A8F9A" />
            <input
              type="email"
              value={email}
              onChange={(e) => { setEmail(e.target.value); setError(""); }}
              placeholder="correo@empresa.com"
              style={{ ...inputStyle, paddingLeft: 34 }}
              autoComplete="username"
              autoFocus
            />
          </div>
        </Field>

        <Field label="Contraseña">
          <div className="relative">
            <Lock size={15} style={{ position: "absolute", left: 11, top: 12 }} color="#8A8F9A" />
            <input
              type="password"
              value={password}
              onChange={(e) => { setPassword(e.target.value); setError(""); }}
              placeholder="Ingresa tu contraseña"
              style={{ ...inputStyle, paddingLeft: 34 }}
              autoComplete="current-password"
            />
          </div>
        </Field>

        {error && (
          <p className="text-xs mb-3 flex items-center gap-1.5" style={{ color: RED }}>
            <AlertTriangle size={13} /> {error}
          </p>
        )}

        <PrimaryButton type="submit" full>{loading ? "Ingresando…" : "Ingresar"}</PrimaryButton>
      </form>
    </div>
  );
}

function FormRegresoHerramienta({ herramienta, onSubmit, onClose }) {
  const [form, setForm] = useState({ fechaLlegada: today(), obsRecepcion: "" });
  const [error, setError] = useState("");
  const set = (k) => (e) => { setForm({ ...form, [k]: e.target.value }); setError(""); };
  const confirmar = () => {
    if (!form.fechaLlegada) { setError("Indica la fecha de llegada."); return; }
    if (herramienta.fechaSalida && form.fechaLlegada < herramienta.fechaSalida) {
      setError("La fecha de llegada no puede ser anterior a la fecha de salida.");
      return;
    }
    onSubmit(form);
  };
  return (
    <Modal title={`Regreso: ${herramienta.nombre}`} onClose={onClose}>
      <div className="rounded-lg p-3 mb-3 text-xs" style={{ background: "#F7F9FC", border: `1px solid ${LINE}`, color: "#5B6272" }}>
        <p>Salió el {fmtDate(herramienta.fechaSalida)} hacia <span className="font-medium">{herramienta.instalacion}</span> (a cargo de {herramienta.responsable}).</p>
        {herramienta.obsEntrega && <p className="mt-1"><span className="font-medium">Obs. de entrega:</span> {herramienta.obsEntrega}</p>}
      </div>
      <Field label="Fecha de llegada"><input style={inputStyle} type="date" value={form.fechaLlegada} min={herramienta.fechaSalida || undefined} max={today()} onChange={set("fechaLlegada")} /></Field>
      <Field label="Observaciones de recepción (opcional)">
        <textarea style={textareaStyle} value={form.obsRecepcion} onChange={set("obsRecepcion")} placeholder="Cómo se recibe la herramienta: estado, faltantes, daños, desgaste…" />
      </Field>
      {error && (
        <p className="text-xs mb-3 flex items-center gap-1.5" style={{ color: RED }}>
          <AlertTriangle size={13} /> {error}
        </p>
      )}
      <PrimaryButton full onClick={confirmar}>Confirmar regreso</PrimaryButton>
    </Modal>
  );
}
